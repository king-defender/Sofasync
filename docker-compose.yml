services:
  postgres:
    image: postgres:16
    container_name: sofasync_postgres
    restart: always
    environment:
      POSTGRES_USER: sofasync
      POSTGRES_PASSWORD: sofasync
      POSTGRES_DB: sofasync
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: sofasync_redis
    restart: always
    ports:
      - "6380:6379"

volumes:
  pgdata:
